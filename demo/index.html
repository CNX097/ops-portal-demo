<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cổng sự kiện - Bản demo</title>
<meta name="description" content="Bản demo portal vận hành sự kiện offline: sự kiện, checklist trước-trong-sau, công việc, ngân sách và tài liệu. Dữ liệu mẫu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #12302f;
  --ink-soft: #5b7270;
  --line: #dbe7e5;
  --bg: #eef5f4;
  --card: #ffffff;
  --teal: #0f766e;
  --teal-d: #0a5a54;
  --teal-wash: #d9f0ec;
  --amber: #b45309;
  --amber-wash: #fef3c7;
  --red: #b91c1c;
  --red-wash: #fee2e2;
  --green: #15803d;
  --green-wash: #dcfce7;
  --slate-wash: #e8eeed;
  --violet: #6d28d9;
  --violet-wash: #ede9fe;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14.5px; line-height: 1.5; font-variant-numeric: tabular-nums;
  background-image: radial-gradient(rgba(15,118,110,.09) 1px, transparent 1px);
  background-size: 22px 22px;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.demo-strip {
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
  padding: 7px 18px; background: var(--amber-wash); color: var(--amber); font-size: 12.5px;
}
.demo-strip button { background: none; border: 1px solid currentColor; border-radius: 6px; padding: 1px 10px; white-space: nowrap; }

.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 34px); }
.side {
  position: sticky; top: 0; height: calc(100vh - 34px); overflow-y: auto;
  background: linear-gradient(185deg, #0a2d30 0%, #0c4043 58%, #0f5457 100%); color: #cfe6e3;
  padding: 20px 12px 28px; display: flex; flex-direction: column; gap: 6px;
}
.side::after {
  content: ""; position: absolute; left: 22px; bottom: 26px; width: 120px; height: 120px; pointer-events: none;
  border: 2px solid rgba(245,158,11,.18); border-radius: 26px; transform: rotate(18deg);
  box-shadow: 34px -30px 0 -2px rgba(255,255,255,.05);
}
.logo { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
.logo b { display: block; color: #fff; font-size: 17px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
.logo small { display: block; font-size: 10.5px; letter-spacing: .14em; color: #5eead4; font-weight: 600; margin-top: 3px; }
.nav-group { margin: 14px 10px 4px; font-size: 11.5px; letter-spacing: .1em; color: #7fb3ae; font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 2px; position: relative; z-index: 1; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px;
  color: #cfe6e3; text-decoration: none; font-weight: 500; position: relative;
}
.nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav a[aria-current="page"] { background: rgba(255,255,255,.13); color: #fff; font-weight: 600; }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: #5eead4; }
.nav .count { margin-left: auto; background: #f59e0b; color: #3b2300; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 0 7px; line-height: 19px; }

.body { min-width: 0; }
.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; justify-content: space-between;
  padding: 12px 24px; background: rgba(238,245,244,.88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.search { position: relative; flex: 1; max-width: 450px; }
.search svg { position: absolute; left: 12px; top: 10px; color: var(--ink-soft); }
.search input { width: 100%; border: 1px solid var(--line); background: #f8fbfa; border-radius: 10px; padding: 9px 12px 9px 38px; }
.top-right { display: flex; align-items: center; gap: 18px; }
.bell { position: relative; background: none; border: 0; padding: 4px; color: var(--ink-soft); }
.bell span { position: absolute; top: -4px; right: -6px; background: #dc2626; color: #fff; font-size: 11px; font-weight: 700; border-radius: 9px; padding: 0 5px; line-height: 16px; }
.me { display: flex; align-items: center; gap: 10px; line-height: 1.25; }
.me small { display: block; color: var(--ink-soft); font-size: 12.5px; }

main { padding: 26px 28px 60px; max-width: 1180px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
.page-head p { margin: 4px 0 0; color: var(--ink-soft); max-width: 70ch; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 500; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--teal); }
.btn.primary { background: linear-gradient(135deg, #0f766e, #0d9488); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(15,118,110,.28); }
.btn.sm { padding: 5px 11px; font-size: 13.5px; border-radius: 8px; }
.btn.ghost-light { background: #fff; color: var(--teal-d); border-color: transparent; font-weight: 600; }
.link { background: none; border: 0; color: var(--teal-d); font-weight: 600; padding: 0; }

.hero {
  position: relative; overflow: hidden; border-radius: 20px; padding: 26px 28px; color: #fff;
  background: linear-gradient(120deg, #0b3f45 0%, #0f6a6c 55%, #1a8a8f 100%);
  box-shadow: 0 10px 30px rgba(11,63,69,.25); display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;
}
.hero::after { content: ""; position: absolute; right: 180px; top: -40px; width: 200px; height: 200px; border-radius: 40px; border: 2px solid rgba(255,255,255,.14); transform: rotate(20deg); pointer-events: none; }
.hero small { opacity: .8; }
.hero h1 { margin: 2px 0 4px; font-size: 30px; line-height: 1.15; letter-spacing: -.02em; }
.hero p { margin: 0 0 14px; color: #8cf0e2; font-weight: 600; font-style: italic; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2); border-radius: 20px; padding: 3px 12px; font-size: 13px; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 18px 0; }
.stat { background: var(--card); border-radius: 16px; padding: 16px; display: flex; gap: 14px; box-shadow: 0 1px 2px rgba(18,48,47,.06), 0 6px 16px rgba(18,48,47,.04); }
.stat .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
.stat .lbl { color: var(--ink-soft); font-size: 13px; line-height: 1.3; }
.stat .num { font-size: 26px; font-weight: 700; line-height: 1.2; }
.stat .sub { color: var(--ink-soft); font-size: 12.5px; line-height: 1.3; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }
.card { background: var(--card); border-radius: 16px; box-shadow: 0 1px 2px rgba(18,48,47,.06), 0 6px 16px rgba(18,48,47,.04); min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px 10px; }
.card-head h2 { margin: 0; font-size: 16px; }
.card-head p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
.card-pad { padding: 4px 18px 18px; }
.empty { padding: 18px; color: var(--ink-soft); }

.trow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto 46px 128px; gap: 10px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line); }
.trow.compact { grid-template-columns: 22px minmax(0, 1fr) auto auto 46px 128px 56px; }
.circ { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #9db4b1; background: none; padding: 0; }
.circ.done { background: var(--green); border-color: var(--green); position: relative; }
.circ.done::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.ttitle { font-weight: 500; line-height: 1.3; }
.trow.is-done .ttitle { text-decoration: line-through; color: var(--ink-soft); }
.tsub { color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tdate { color: var(--ink-soft); font-size: 13px; text-align: right; }
.icon-btn { background: none; border: 0; color: var(--ink-soft); padding: 4px; border-radius: 6px; }
.icon-btn:hover { background: var(--slate-wash); color: var(--ink); }
.icons { display: flex; gap: 2px; justify-content: flex-end; }

.chip { display: inline-block; padding: 1px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1.6; }
.chip.red { background: var(--red-wash); color: var(--red); }
.chip.amber { background: var(--amber-wash); color: var(--amber); }
.chip.teal { background: var(--teal-wash); color: var(--teal-d); }
.chip.green { background: var(--green-wash); color: var(--green); }
.chip.slate { background: var(--slate-wash); color: var(--ink-soft); }
.chip.violet { background: var(--violet-wash); color: var(--violet); }

select.st { border: 0; border-radius: 10px; padding: 5px 8px; font-size: 13.5px; font-weight: 500; width: 100%; background-color: var(--teal-wash); color: var(--teal-d); }
select.st.todo { background-color: var(--slate-wash); color: var(--ink); }
select.st.blocked { background-color: var(--red-wash); color: var(--red); }
select.st.done { background-color: var(--green-wash); color: var(--green); }
select.st.canceled { background-color: var(--slate-wash); color: var(--ink-soft); }
select.st.wait { background-color: var(--violet-wash); color: var(--violet); }
.field { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; }

.evrow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line); }
.evrow a { color: inherit; text-decoration: none; }
.tile { text-align: center; background: var(--teal-wash); color: var(--teal-d); border-radius: 10px; padding: 3px 0; line-height: 1.15; }
.tile small { display: block; font-size: 11px; font-weight: 600; }
.tile b { font-size: 17px; }
.tile.live { background: var(--green-wash); color: var(--green); }
.evrow .meta { color: var(--ink-soft); font-size: 12.5px; }
.evrow .right { text-align: right; display: grid; gap: 3px; justify-items: end; font-size: 12.5px; color: var(--ink-soft); }

.risk { padding: 11px 18px; border-top: 1px solid var(--line); }
.risk a { color: inherit; text-decoration: none; font-weight: 600; display: block; line-height: 1.3; }
.risk .flags { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; margin-top: 3px; }
.flag-red { color: var(--red); } .flag-amber { color: var(--amber); }

.feed { padding: 4px 18px 14px; }
.feed .it { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.feed .it:first-child { border-top: 0; }
.feed .t { line-height: 1.35; }
.feed .m { color: var(--ink-soft); font-size: 12.5px; }

.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex: none; }
.avatar.sm { width: 24px; height: 24px; font-size: 10.5px; }
.who { display: inline-flex; align-items: center; gap: 8px; }

.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin: 6px 0 16px; overflow-x: auto; }
.tabs a { padding: 9px 2px; color: var(--ink-soft); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; }
.tabs a[aria-current="page"] { color: var(--teal-d); border-bottom-color: var(--teal); font-weight: 600; }
.tabs .n { background: var(--teal-wash); color: var(--teal-d); border-radius: 10px; padding: 0 7px; font-size: 12px; margin-left: 6px; }
.tabs .n.warn { background: var(--amber-wash); color: var(--amber); }

.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; letter-spacing: .06em; color: var(--ink-soft); font-weight: 700; padding: 12px 16px; border-bottom: 1px solid var(--line); text-transform: uppercase; }
td { padding: 12px 16px; border-top: 1px solid var(--line); vertical-align: top; }
tbody tr:first-child td { border-top: 0; }
td.num, th.num { text-align: right; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--ink-soft); word-break: break-all; }
.rowlink { color: inherit; text-decoration: none; font-weight: 600; }
.rowlink:hover { color: var(--teal-d); }
.d { line-height: 1.25; } .d b { display: block; font-size: 15px; } .d small { display: block; color: var(--ink-soft); }
.d .soon { color: #c2410c; font-weight: 600; }
.mini { height: 6px; background: var(--slate-wash); border-radius: 4px; overflow: hidden; margin-top: 4px; min-width: 90px; }
.mini i { display: block; height: 100%; background: #f59e0b; }
.mini i.full { background: var(--green); }
.warnline { color: #c2410c; font-size: 12.5px; margin-top: 4px; }

.phase { background: var(--card); border-radius: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(18,48,47,.06), 0 6px 16px rgba(18,48,47,.04); overflow: hidden; }
.phase-head { display: flex; align-items: center; gap: 14px; padding: 12px 18px; }
.phase-head h3 { margin: 0; font-size: 15px; } .phase-head small { color: var(--ink-soft); display: block; }
.phase-head .bar { flex: 1; max-width: 160px; margin-left: auto; height: 6px; background: var(--slate-wash); border-radius: 4px; overflow: hidden; }
.phase-head .bar i { display: block; height: 100%; background: linear-gradient(90deg, #0f766e, #14b8a6); }

.detail-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.info { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; padding: 16px 18px 18px; }
.info dt { color: var(--ink-soft); font-size: 12.5px; } .info dd { margin: 0; font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; padding: 4px 18px 16px; align-items: center; }
.kv dt { color: var(--ink-soft); } .kv dd { margin: 0; text-align: right; font-weight: 600; }
.progress3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 4px 18px 18px; }
.progress3 .lab { display: flex; justify-content: space-between; font-weight: 600; }
.progress3 .lab span { color: var(--ink-soft); font-weight: 500; }
.progress3 .bar { height: 6px; background: var(--slate-wash); border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
.progress3 .bar i { display: block; height: 100%; background: #f59e0b; }

.docgroup { background: var(--card); border-radius: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(18,48,47,.06); overflow: hidden; }
.docgroup h3 { margin: 0; padding: 12px 18px 2px; font-size: 15px; } .docgroup > small { padding: 0 18px 8px; display: block; color: var(--ink-soft); }
.file { display: flex; align-items: center; gap: 10px; padding: 9px 18px; border-top: 1px solid var(--line); }
.file .fi { color: var(--teal); } .file .fi.pdf { color: #dc2626; } .file .fi.xlsx { color: #15803d; } .file .fi.png { color: #7c3aed; }
.file span.f { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file small { color: var(--ink-soft); }

.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.kcol { background: rgba(255,255,255,.6); border-radius: 14px; padding: 10px; border: 1px solid var(--line); }
.kcol h3 { margin: 4px 6px 10px; font-size: 14px; display: flex; justify-content: space-between; }
.kcard { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(18,48,47,.08); }

.group-title { padding: 14px 18px 4px; font-weight: 700; }
.group-title.red { color: var(--red); }
.group-title small { color: var(--ink-soft); font-weight: 500; display: block; }

.stub { text-align: center; padding: 56px 20px; color: var(--ink-soft); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #0c2f31; color: #fff; padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 50; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1000px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2, .detail-grid { grid-template-columns: 1fr; }
  .kanban { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; gap: 4px; align-items: center; }
  .side::after, .logo small, .nav-group { display: none; }
  .logo { padding: 0 10px 0 4px; white-space: nowrap; }
  .nav { flex-direction: row; } .nav a { white-space: nowrap; padding: 8px 10px; } .nav a svg { display: none; }
  .nav a[aria-current="page"]::before { display: none; }
  main { padding: 18px 14px 48px; }
  .top { padding: 10px 14px; }
  .me div { display: none; }
  .trow, .trow.compact { grid-template-columns: 22px minmax(0, 1fr) 118px; }
  .trow .chip, .trow .tdate, .trow .icons { display: none; }
  .info { grid-template-columns: 1fr; }
  .progress3 { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .stats, .kanban { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<div class="demo-strip" role="note">
  <span>Bản demo với dữ liệu mẫu hư cấu. Mọi thao tác chỉ diễn ra trên trình duyệt của bạn.</span>
  <button type="button" data-act="reset">Đặt lại dữ liệu mẫu</button>
</div>

<div class="shell">
  <aside class="side" aria-label="Thanh bên">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="7" width="18" height="18" rx="5" fill="#14b8a6" transform="rotate(-12 12 16)"/><rect x="13" y="9" width="18" height="18" rx="5" fill="#f59e0b" opacity=".92" transform="rotate(10 22 18)"/></svg>
      <div><b>Cổng sự kiện</b><small>VẬN HÀNH · PORTAL</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
  </aside>
  <div class="body">
    <header class="top">
      <label class="search"><span class="sr">Tìm kiếm</span><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="Tìm sự kiện, mã EV, việc, trường..." autocomplete="off"></label>
      <div class="top-right">
        <button class="bell" type="button" data-act="bell" aria-label="Thông báo"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span>5</span></button>
        <div class="me"><span class="avatar" style="background:#0f766e">HN</span><div>Hoàng Nam<small>Trưởng phòng</small></div></div>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* Toàn bộ tên người, trường, sự kiện, mã và số liệu bên dưới đều là hư cấu. */

const DAY = 864e5;
const T0 = new Date(); T0.setHours(0, 0, 0, 0);
const dt = (n) => new Date(T0.getTime() + n * DAY);
const dm = (n) => String(dt(n).getDate()).padStart(2, "0") + "/" + String(dt(n).getMonth() + 1).padStart(2, "0");
const dmy = (n) => dm(n) + "/" + dt(n).getFullYear();

function dueChip(t) {
  if (!isOpen(t) || t.st === "wait") return "";
  const d = due(t);
  return d < 0 ? `<span class="chip red">${remain(d)}</span>` : `<span class="chip slate">${remain(d)}</span>`;
}
function statusSelect(t) {
  const opts = Object.entries(STATUS).map(([k, v]) => `<option value="${k}"${t.st === k ? " selected" : ""}>${v}</option>`).join("");
  const wait = t.st === "wait" ? '<option value="wait" selected disabled>Chờ duyệt</option>' : "";
  return `<select class="st ${t.st}" data-task="${t.id}" aria-label="Trạng thái: ${esc(t.title)}">${wait}${opts}</select>`;
}

/* --- Sự kiện --- */
const EF = { tab: "sap", q: "", area: "", pic: "" };
function eventList() {
  const q = EF.q.trim().toLowerCase();
  return EVENTS.filter((e) => {
    if (EF.tab === "sap" && !(e.off >= 0 && e.status !== "done")) return false;
    if (EF.tab === "can" && !(e.off < 0 && e.status !== "done")) return false;
    if (EF.tab === "xong" && e.status !== "done") return false;
    if (EF.area && e.area !== EF.area) return false;
    if (EF.pic && EF.pic !== ME) return false;
    if (q && !(e.name + " " + e.school + " " + e.code).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => EF.tab === "sap" ? a.off - b.off : b.off - a.off);
}
function eventRows() {
  const list = eventList();
  if (!list.length) return '<tr><td colspan="5"><p class="empty">Không có sự kiện phù hợp bộ lọc.</p></td></tr>';
  return list.map((e) => {
    const p = progress(e.id);
    return `<tr><td><div class="d"><b>${dm(e.off)}</b><small>${wd(e.off)}${e.time ? " · " + e.time : ""}</small>${e.off >= 0 ? `<small class="soon">${remain(e.off)}</small>` : ""}</div></td>
      <td><a class="rowlink" href="#/su-kien/${e.id}">${esc(e.name)}</a><div class="meta" style="color:var(--ink-soft);font-size:13px">${esc(e.school)} · ${esc(e.area)} · ${esc(e.type)}</div><div class="mono">${esc(e.code)}</div>
        ${prChip(e) ? `<div style="margin-top:4px">${prChip(e)}</div>` : ""}${e.badDate ? `<div class="warnline">Ngày tổ chức sai định dạng (cần dd/mm/yyyy)</div>` : ""}</td>
      <td><span class="who">${av(ME, true)} Hoàng Nam</span></td><td>${evChip(e)}</td>
      <td>${p.total ? `<div style="display:flex;justify-content:space-between;gap:8px"><span>${p.done}/${p.total}</span>${p.late ? `<span class="flag-red" style="font-size:12.5px;font-weight:600">${p.late} quá hạn</span>` : ""}</div><div class="mini"><i class="${p.done === p.total ? "full" : ""}" style="width:${Math.round(p.done / p.total * 100)}%"></i></div>` : '<span style="color:var(--ink-soft)">Chưa có checklist</span>'}</td></tr>`;
  }).join("");
}
function viewEvents() {

  <div class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<a href="#/su-kien" role="tab" data-etab="${k}"${EF.tab === k ? ' aria-current="page"' : ""}>${l}${n ? `<span class="n${k === "can" ? " warn" : ""}">${n}</span>` : ""}</a>`).join("")}</div>

    <select class="field" id="ef-pic" aria-label="PIC"><option value="">Mọi PIC</option><option value="${ME}"${EF.pic ? " selected" : ""}>Hoàng Nam</option></select>

}

    <section class="card"><dl class="info">

      <div><dt>Thời gian</dt><dd>${e.time ? e.time + " – " + String(parseInt(e.time, 10) + 5).padStart(2, "0") + ":00" : "Chưa cập nhật"}</dd></div>
      <div><dt>Địa điểm</dt><dd>${esc(e.place)}</dd></div><div><dt>PIC</dt><dd><span class="who">${av(ME, true)} Hoàng Nam</span></dd></div></dl></section>
    <section class="card"><div class="card-head"><div><h2>Tiến độ checklist</h2></div><a class="link" href="#/su-kien/${e.id}?tab=checklist">Xem checklist →</a></div>
      ${p.total ? `<div class="progress3">${phaseBars}</div>` : '<p class="empty">Sự kiện này chưa có checklist. Mở tab Checklist để áp dụng mẫu.</p>'}</section>

function detailChecklist(e) {
  const p = progress(e.id);
  const note = `<p style="color:var(--ink-soft)">Hạn của checklist tính theo ngày tổ chức ${dmy(e.off)}. Việc có nhãn <b style="color:var(--ink)">cần duyệt</b> phải được PIC hoặc Leader duyệt mới tính hoàn thành.</p>`;
  const tpl = `<div class="filters"><button class="btn sm" data-act="multi">${ic("tasks")} Chọn nhiều</button>
    <select class="field" aria-label="Mẫu checklist" style="padding:5px 10px"><option>${esc(e.type)} - mẫu chuẩn</option><option>Lễ ký kết MOU - mẫu chuẩn</option><option>Talkshow / Tọa đàm - mẫu chuẩn</option></select>
    <button class="btn sm" data-act="applytpl" data-id="${e.id}">Áp dụng mẫu checklist</button><button class="btn sm primary" data-act="addtask" data-id="${e.id}" data-phase="truoc">${ic("plus")} Thêm việc</button></div>`;
  if (!p.total) return note + tpl + `<div class="card"><p class="stub">Sự kiện này chưa có checklist.<br>Bấm "Áp dụng mẫu checklist" để tạo nhanh các đầu việc trước, trong và sau sự kiện.</p></div>`;
  return note + tpl + PHASES.map(([k, l]) => {
    const L = S.tasks.filter((t) => t.ev === e.id && t.phase === k && t.st !== "canceled");
    const d = L.filter((t) => t.st === "done").length;
    return `<section class="phase"><div class="phase-head"><div><h3>${l}</h3><small>${d}/${L.length} hoàn thành</small></div><button class="btn sm" data-act="addtask" data-id="${e.id}" data-phase="${k}" style="margin-left:auto;border:0;background:none">${ic("plus")} Thêm</button><div class="bar"><i style="width:${L.length ? Math.round(d / L.length * 100) : 0}%"></i></div></div>
      ${L.length ? L.map((t) => taskRow(t, { hideEvent: true, tools: true })).join("") : '<p class="empty">Chưa có việc ở giai đoạn này.</p>'}</section>`;
  }).join("");
}

/* --- Công việc --- */
const TF = { tab: "mine", status: "open", ev: "" };
function viewTasks() {
  const tabs = [["mine", "Việc của tôi"], ["approve", "Chờ tôi duyệt"], ["assigned", "Tôi giao"], ["all", "Tất cả"], ["kanban", "Bảng Kanban"]];
  let L = S.tasks.filter((t) => t.st !== "canceled" || TF.status === "all");
  if (TF.tab === "mine") L = L.filter((t) => t.own === ME);
  if (TF.tab === "approve") L = L.filter((t) => t.st === "wait");
  if (TF.tab === "assigned") L = L.filter((t) => t.by === ME && t.own !== ME);
  if (TF.status === "open" && TF.tab !== "approve") L = L.filter((t) => isOpen(t));
  if (TF.ev) L = L.filter((t) => String(t.ev) === TF.ev);
  L.sort((a, b) => due(a) - due(b));
  const filters = `<div class="filters"><select class="field" id="tf-status" aria-label="Trạng thái"><option value="open"${TF.status === "open" ? " selected" : ""}>Đang mở</option><option value="all"${TF.status === "all" ? " selected" : ""}>Tất cả trạng thái</option></select>
    <select class="field" id="tf-ev" aria-label="Sự kiện"><option value="">Mọi sự kiện</option>${EVENTS.filter((e) => S.tasks.some((t) => t.ev === e.id)).map((e) => `<option value="${e.id}"${TF.ev === String(e.id) ? " selected" : ""}>${esc(e.name)} (${esc(e.school)})</option>`).join("")}</select></div>`;
  let body;
  if (TF.tab === "kanban") {
    body = `<div class="kanban">${Object.entries(STATUS).filter(([k]) => k !== "canceled").map(([k, l]) => { const c = L.filter((t) => t.st === k || (k === "doing" && t.st === "wait"));
      return `<div class="kcol"><h3>${l}<span class="chip slate">${c.length}</span></h3>${c.map((t) => `<div class="kcard"><div class="ttitle">${esc(t.title)}</div><div class="tsub">${esc(evById(t.ev).name)}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">${av(t.own, true)}${dueChip(t) || `<span class="tdate">${dm(due(t))}</span>`}</div></div>`).join("") || '<p class="tsub" style="padding:6px">Trống</p>'}</div>`; }).join("")}</div>`;
  } else if (TF.tab === "approve") {
    body = `<section class="card">${L.length ? L.map((t) => `<div class="trow" style="grid-template-columns:22px minmax(0,1fr) auto auto"><span class="circ"></span><div><div class="ttitle">${esc(t.title)} <span class="chip violet">cần duyệt</span></div><div class="tsub">${esc(evById(t.ev).name)} · ${esc(PEOPLE[t.own].name)}</div></div><button class="btn sm primary" data-act="approve" data-id="${t.id}">Duyệt</button><button class="btn sm" data-act="return" data-id="${t.id}">Trả lại</button></div>`).join("") : '<p class="empty">Không có việc nào chờ bạn duyệt.</p>'}</section>`;
  } else {
    const groups = [["Quá hạn", L.filter((t) => isOpen(t) && due(t) < 0), "red"], ["7 ngày tới", L.filter((t) => isOpen(t) && due(t) >= 0 && due(t) <= 7), ""], ["Sau đó", L.filter((t) => isOpen(t) && due(t) > 7), ""], ["Đã xong hoặc đã hủy", L.filter((t) => !isOpen(t)), ""]].filter((g) => g[1].length);
    body = groups.length ? groups.map(([l, items, c]) => `<section class="card" style="margin-bottom:16px"><div class="group-title ${c}">${l}<small>${items.length} việc</small></div>${items.map((t) => taskRow(t)).join("")}</section>`).join("") : '<div class="card"><p class="empty">Không có việc nào phù hợp.</p></div>';
  }
  return head("Công việc", "Mọi đầu việc trước, trong và sau sự kiện. Cập nhật trạng thái ngay tại danh sách, mọi người thấy theo thời gian thực.", `<button class="btn primary" data-act="addany">${ic("plus")} Thêm việc</button>`) + `
  <div class="tabs">${tabs.map(([k, l]) => `<a href="#/cong-viec" data-ttab="${k}"${TF.tab === k ? ' aria-current="page"' : ""}>${l}${k === "approve" && waiting().length ? `<span class="n warn">${waiting().length}</span>` : ""}</a>`).join("")}</div>${filters}${body}`;
}

const BT = { tab: "pr" };
function viewBudget() {
  const withPr = EVENTS.filter((e) => e.pr && e.pr.state !== "none");
  const totalPr = withPr.reduce((n, e) => n + e.pr.amount, 0);
  const totalPm = PM.reduce((n, x) => n + x.amount, 0);
  const unpaid = PM.filter((x) => !x.paid);
  const unpaidSum = unpaid.reduce((n, x) => n + x.amount, 0);
  const prLate = EVENTS.filter((e) => e.prLate).length + 2;
  const stat = (color, icon, label, num, sub) => `<div class="stat"><div class="ico" style="background:${color}">${ic(icon)}</div><div><div class="lbl">${label}</div><div class="num">${num}</div><div class="sub">${sub}</div></div></div>`;
  const tabs = [["pr", "Sự kiện - PR", withPr.length], ["pm", "Thanh toán - PM", PM.length], ["orphan", "Chưa có trên portal", ORPHAN.length]];
  let table;
  if (BT.tab === "pm") {
    table = `<thead><tr><th>Mã PM</th><th>Nhà cung cấp</th><th>Sự kiện</th><th class="num">Số tiền</th><th>Trạng thái</th></tr></thead><tbody>${PM.map((x) => `<tr><td class="mono" style="color:var(--ink)">${x.no}</td><td>${esc(x.vendor)}</td><td>${esc(evById(x.ev).name)}<div class="meta" style="color:var(--ink-soft);font-size:12.5px">${esc(evById(x.ev).school)}</div></td><td class="num">${vnd(x.amount)}</td><td>${x.paid ? '<span class="chip green">Đã thanh toán</span>' : `<button class="btn sm" data-act="paypm" data-id="${x.no}">Đánh dấu đã thanh toán</button>`}</td></tr>`).join("")}</tbody>`;
  } else if (BT.tab === "orphan") {
    table = `<thead><tr><th>Ngày</th><th>Sự kiện</th><th>Mã PR</th><th></th></tr></thead><tbody>${ORPHAN.map((x) => `<tr><td>${dmy(x.date)}</td><td>${esc(x.name)}<div class="meta" style="color:var(--ink-soft);font-size:12.5px">${esc(x.school)}</div></td><td class="mono" style="color:var(--ink)">${x.pr}</td><td><button class="btn sm" data-act="create">Tạo sự kiện từ dòng này</button></td></tr>`).join("")}</tbody>`;
  } else {
    const rows = EVENTS.slice().sort((a, b) => b.off - a.off);
    table = `<thead><tr><th>Ngày</th><th>Sự kiện</th><th>Mã PR</th><th class="num">Ngân sách</th><th class="num">PM</th><th>Trạng thái</th><th>Cảnh báo / việc tiếp theo</th></tr></thead><tbody>${rows.map((e) => {
      const pm = PM.filter((x) => x.ev === e.id && x.paid).reduce((n, x) => n + x.amount, 0);
      const warn = e.prLate ? `<span class="flag-red">PR quá hạn ${e.prLate} ngày</span>` : (!e.pr || e.pr.state === "none") && e.off > 0 ? '<span class="flag-amber">Chưa nộp PR</span>' : "";
      return `<tr><td>${dmy(e.off)}</td><td><a class="rowlink" href="#/su-kien/${e.id}">${esc(e.name)}</a><div class="meta" style="color:var(--ink-soft);font-size:12.5px">${esc(e.school)}</div></td><td class="mono" style="color:var(--ink)">${e.pr && e.pr.no ? esc(e.pr.no) : "-"}</td><td class="num">${e.pr && e.pr.amount ? vnd(e.pr.amount) : "-"}</td><td class="num">${pm ? vnd(pm) : "0 ₫"}</td><td>${prChip(e) || "-"}</td><td>${warn}</td></tr>`; }).join("")}</tbody>`;
  }
  return head("Ngân sách PR / PM", "Đồng bộ với sheet quản lý ngân sách và tiến độ PR-PM. Bấm Cập nhật để đổi trạng thái PR/PM, portal tự ghi vào sheet.",
    `<button class="btn" data-act="sheet">${ic("sheet")} Mở sheet</button>`) + `
  <div class="stats">
    ${stat("linear-gradient(135deg,#0f766e,#14b8a6)", "wallet", "Tổng ngân sách PR (sau thuế)", tr(totalPr), `${withPr.length} PR`)}
    ${stat("linear-gradient(135deg,#2563eb,#38bdf8)", "sheet", "Tổng PM (sau thuế)", tr(totalPm), `${PM.length} khoản chi`)}
    ${stat("linear-gradient(135deg,#d97706,#fbbf24)", "clock", "PM chưa thanh toán", unpaid.length, tr(unpaidSum))}
    ${stat("linear-gradient(135deg,#dc2626,#f97316)", "alert", "PR quá hạn", prLate, `${prLate - 1} dòng sheet cần sửa dữ liệu`)}
  </div>
  <div class="tabs">${tabs.map(([k, l, n]) => `<a href="#/ngan-sach" data-btab="${k}"${BT.tab === k ? ' aria-current="page"' : ""}>${l}<span class="n">${n}</span></a>`).join("")}</div>
  <section class="card"><div class="table-wrap"><table>${table}</table></div></section>`;
}

/* --- Tài liệu --- */
const DF = { tab: "ev", q: "", folder: "" };
function docGroups() {
  const q = DF.q.trim().toLowerCase();
  return EVENTS.filter((e) => e.status !== "plan" || e.id % 2 === 0).sort((a, b) => b.off - a.off).map((e) => {
    const n = 2 + ((e.id * 3) % 5);
    const files = Array.from({ length: n }, (_, i) => { const name = DOCS[(e.id + i) % DOCS.length]; return { name, folder: (e.id + i) % FOLDERS.length, size: 120 + ((e.id * 37 + i * 91) % 900) }; })
      .filter((f) => (!q || f.name.toLowerCase().includes(q)) && (DF.folder === "" || String(f.folder) === DF.folder));
    return { e, files };
  }).filter((g) => g.files.length);
}
function docList() {
  const gs = docGroups();
  if (!gs.length) return '<div class="card"><p class="empty">Không tìm thấy tệp nào.</p></div>';
  return gs.map(({ e, files }) => `<section class="docgroup"><h3>${dm(e.off)} · ${esc(e.name)}</h3><small>${files.length} tệp</small>
    ${files.map((f) => { const ext = f.name.split(".").pop(); return `<div class="file"><span class="fi ${ext}">${ic("file")}</span><span class="f">${esc(f.name)}</span><small>${esc(FOLDERS[f.folder])} · ${f.size} KB</small></div>`; }).join("")}</section>`).join("");
}
function viewDocs() {
  const tabs = [["ev", "Theo sự kiện"], ["school", "Hồ sơ trường và MOU"], ["lib", "Thư viện chung (SOP, mẫu biểu)"]];
  const body = DF.tab === "ev" ? `<div class="filters"><input class="field" id="df-q" type="search" placeholder="Tìm theo tên tệp..." value="${esc(DF.q)}" aria-label="Tìm tệp" style="min-width:240px">
      <select class="field" id="df-folder" aria-label="Thư mục"><option value="">Mọi thư mục</option>${FOLDERS.map((f, i) => `<option value="${i}"${DF.folder === String(i) ? " selected" : ""}>${f}</option>`).join("")}</select></div><div id="doclist">${docList()}</div>`
    : '<div class="card"><p class="stub">Mục này chưa có trong bản demo.</p></div>';
  return head("Tài liệu", "Danh sách tệp đồng bộ từ Google Drive. Mỗi sự kiện có cùng một cấu trúc thư mục chuẩn.", `<button class="btn" data-act="drive">${ic("folder")} Thư mục gốc trên Drive</button>`) +
    `<div class="tabs">${tabs.map(([k, l]) => `<a href="#/tai-lieu" data-dtab="${k}"${DF.tab === k ? ' aria-current="page"' : ""}>${l}</a>`).join("")}</div>${body}`;
}

const STUBS = { "lich": "Lịch", "doi-tac": "Đối tác & Trường", "brief-sale": "Brief Sale", "khao-sat": "Khảo sát SV", "hieu-suat": "Hiệu suất & Báo cáo", "nhan-su": "Nhân sự", "nguoi-dung": "Người dùng", "mau-checklist": "Mẫu checklist", "ket-noi": "Kết nối Google" };
const viewStub = (key) => head(STUBS[key], "") + '<div class="card"><p class="stub">Màn hình này chưa có trong bản demo.</p></div>';

/* ---------- Điều hướng và vẽ ---------- */

const NAV = [
  ["tong-quan", "Tổng quan", "home"], ["su-kien", "Sự kiện", "event"], ["lich", "Lịch", "cal"], ["cong-viec", "Công việc", "tasks"],
  ["tai-lieu", "Tài liệu", "folder"], ["doi-tac", "Đối tác & Trường", "school"], ["brief-sale", "Brief Sale", "mega"], ["khao-sat", "Khảo sát SV", "survey"],
  ["ngan-sach", "Ngân sách PR/PM", "wallet"], ["hieu-suat", "Hiệu suất & Báo cáo", "chart"], ["nhan-su", "Nhân sự", "user"],
  "QUẢN TRỊ", ["nguoi-dung", "Người dùng", "users"], ["mau-checklist", "Mẫu checklist", "clip"], ["ket-noi", "Kết nối Google", "plug"]
];
function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, "") || "tong-quan";
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const params = new URLSearchParams(qs || "");
  return { page: parts[0] || "tong-quan", id: parts[1] ? Number(parts[1]) : null, tab: params.get("tab") || "tong-quan" };
}
function renderNav(page) {
  const late = mine().filter((t) => due(t) < 0).length;
  $("#nav").innerHTML = NAV.map((n) => typeof n === "string" ? `<div class="nav-group">${n}</div>` :
    `<a href="#/${n[0]}"${n[0] === page ? ' aria-current="page"' : ""}>${ic(n[2])}${esc(n[1])}${n[0] === "cong-viec" && late ? `<span class="count">${late}</span>` : ""}</a>`).join("");
}
function render(focus) {
  const r = parseRoute();
  renderNav(r.page);
  let html;
  if (r.page === "tong-quan") html = viewDashboard();
  else if (r.page === "su-kien") html = r.id ? viewEventDetail(r.id, r.tab) : viewEvents();
  else if (r.page === "cong-viec") html = viewTasks();
  else if (r.page === "ngan-sach") html = viewBudget();
  else if (r.page === "tai-lieu") html = viewDocs();
  else if (STUBS[r.page]) html = viewStub(r.page);
  else html = head("Không tìm thấy trang", "") + '<p><a class="link" href="#/tong-quan">← Về Tổng quan</a></p>';
  $("#main").innerHTML = html;
  if (focus) { $("#main").focus({ preventScroll: true }); window.scrollTo(0, 0); }
}

let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
const log = (text, ev) => S.activity.unshift({ who: "Hoàng Nam", text, ev, ago: "vừa xong" });

const TEMPLATE = [["truoc", "Chốt kịch bản và timeline", -10], ["truoc", "Xác nhận nhà cung cấp", -7], ["truoc", "Gửi thư mời và xác nhận khách mời", -5], ["trong", "Onsite sự kiện", 0], ["sau", "Lên bài biết hậu sự kiện", 2], ["sau", "Báo cáo kết quả sự kiện", 4]];
const ACTIONS = {
  reset() { S = SEED(); EF.tab = "sap"; EF.q = ""; EF.area = ""; EF.pic = ""; TF.tab = "mine"; TF.status = "open"; TF.ev = ""; DF.q = ""; DF.folder = ""; toast("Đã đặt lại dữ liệu mẫu"); },
  create() { toast("Tạo sự kiện (demo, chưa có biểu mẫu)"); },
  import() { toast("Nhập từ sheet (demo, chưa kết nối sheet thật)"); },
  sheet() { toast("Mở sheet (demo, chưa kết nối sheet thật)"); },
  drive() { toast("Mở Drive (demo, chưa kết nối Drive thật)"); },
  edit() { toast("Sửa (demo)"); },
  multi() { toast("Chọn nhiều (demo)"); },
  bell() { toast("5 thông báo mới (demo)"); },
  addany() { toast("Thêm việc: mở một sự kiện, vào tab Checklist rồi bấm Thêm việc"); },
  del(id) { const t = S.tasks.find((x) => x.id === id); S.tasks = S.tasks.filter((x) => x.id !== id); toast(`Đã xóa việc: ${t.title}`); },
  approve(id) { const t = S.tasks.find((x) => x.id === id); t.st = "done"; log(`${t.title}: Chờ duyệt → Hoàn thành`, t.ev); toast(`Đã duyệt: ${t.title}`); },
  return(id) { const t = S.tasks.find((x) => x.id === id); t.st = "doing"; log(`${t.title}: Chờ duyệt → Đang làm`, t.ev); toast(`Đã trả lại: ${t.title}`); },
  paypm(id) { const x = PM.find((p) => p.no === id); x.paid = true; toast(`Đã đánh dấu đã thanh toán: ${x.no}`); },
  applytpl(id) {
    if (S.tasks.some((t) => t.ev === id)) { toast("Sự kiện đã có checklist, chỉ áp dụng mẫu cho sự kiện trống"); return; }
    TEMPLATE.forEach(([ph, title, off]) => S.tasks.push({ id: Math.max(0, ...S.tasks.map((t) => t.id)) + 1, ev: id, phase: ph, title, off, st: "todo", own: ME, prio: false, appr: false, by: ME }));
    log("Áp dụng mẫu checklist", id); toast("Đã áp dụng mẫu checklist");
  },
  addtask(id, el) {
    const ph = el.dataset.phase; const off = ph === "truoc" ? -3 : ph === "trong" ? 0 : 2;
    S.tasks.push({ id: Math.max(0, ...S.tasks.map((t) => t.id)) + 1, ev: id, phase: ph, title: "Việc mới", off, st: "todo", own: ME, prio: false, appr: false, by: ME });
    toast("Đã thêm việc mới");
  }
};

document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-etab],[data-ttab],[data-btab],[data-dtab]");
  if (tab) {
    if (tab.dataset.etab) EF.tab = tab.dataset.etab;
    if (tab.dataset.ttab) TF.tab = tab.dataset.ttab;
    if (tab.dataset.btab) BT.tab = tab.dataset.btab;
    if (tab.dataset.dtab) DF.tab = tab.dataset.dtab;
    e.preventDefault(); render(); return;
  }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (ACTIONS[act]) { ACTIONS[act](Number(b.dataset.id) || b.dataset.id, b); render(); }
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.task) {
    const task = S.tasks.find((x) => x.id === Number(t.dataset.task));
    const from = task.st; task.st = t.value;
    log(`${task.title}: ${STATUS[from] || "Chờ duyệt"} → ${STATUS[task.st]}`, task.ev);
    toast(`${task.title}: ${STATUS[task.st]}`); render();
  } else if (t.dataset.evstatus) {
    const ev = evById(Number(t.dataset.evstatus)); ev.status = t.value; toast(`Trạng thái sự kiện: ${EV_STATUS[ev.status][0]}`); render();
  } else if (t.id === "ef-area") { EF.area = t.value; $("#evbody").innerHTML = eventRows(); }
  else if (t.id === "ef-pic") { EF.pic = t.value; $("#evbody").innerHTML = eventRows(); }
  else if (t.id === "tf-status") { TF.status = t.value; render(); }
  else if (t.id === "tf-ev") { TF.ev = t.value; render(); }
  else if (t.id === "df-folder") { DF.folder = t.value; $("#doclist").innerHTML = docList(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "ef-q") { EF.q = e.target.value; $("#evbody").innerHTML = eventRows(); }
  else if (e.target.id === "df-q") { DF.q = e.target.value; $("#doclist").innerHTML = docList(); }
});
$("#q").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { EF.tab = "all"; EF.q = e.target.value; location.hash = "#/su-kien"; if (parseRoute().page === "su-kien") render(true); }
});
window.addEventListener("hashchange", () => render(true));
render();
</script>
</body>
</html>
